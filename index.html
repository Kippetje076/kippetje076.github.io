<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Drip House</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: white;
            color: black;
            font-family: Arial, sans-serif;
        }

        .header {
            background: white;
            text-align: center;
            padding: 40px 20px 20px;
        }

        .header p {
            color: black;
            font-size: 14px;
            margin: 5px;
        }

        .navigation {
            background: #e8e8e8;
            text-align: center;
            height: 48px;
            padding: 0 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navigation a {
            color: black;
            margin: 0 15px;
            text-decoration: none;
        }

        .navigation a:hover {
            text-decoration: underline;
        }

        .new-title,
        .section-title {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            margin: 30px 0 0;
        }

        .products {
            background: white;
            padding: 40px 20px 20px;
            display: grid;
            grid-template-columns: repeat(2, 300px);
            gap: 30px;
            justify-content: center;
        }

        .divider {
            background: #e8e8e8;
            height: 48px;
            margin: 0;
        }

        .product-card {
            background: #f5f5f5;
            width: 300px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #ccc;
        }

        .product-card img {
            display: block;
            width: 100%;
            height: 270px;
            object-fit: cover;
        }

        .product-card p {
            color: black;
            text-align: center;
            padding: 10px;
            margin: 0;
        }

        @media (max-width: 700px) {
            .navigation {
                height: auto;
                min-height: 48px;
                padding: 10px 15px;
                flex-wrap: wrap;
            }

            .navigation a {
                display: inline-block;
                margin: 5px 8px;
            }

            .products {
                grid-template-columns: 1fr;
                max-width: 300px;
                margin: 0 auto;
                padding: 30px 0 15px;
            }

            .product-card {
                width: 100%;
            }

            .product-card img {
                height: 270px;
            }
        }
    </style>
</head>

<body>

    <header class="header">
        <svg width="220" height="70" role="img" aria-label="Drip House logo">
            <rect
                x="2"
                y="2"
                width="216"
                height="66"
                rx="16"
                fill="white"
                stroke="black"
                stroke-width="2"
            />

            <path
                d="M60 3 v16 a4 4 0 0 0 8 0 V3 Z"
                fill="black"
            />

            <path
                d="M150 3 v12 a4 4 0 0 0 8 0 V3 Z"
                fill="black"
            />

            <text
                x="110"
                y="42"
                font-size="30"
                font-weight="bold"
                text-anchor="middle"
                fill="black"
                font-family="Georgia, serif"
                letter-spacing="4"
            >
                DRIP
            </text>

            <text
                x="110"
                y="58"
                font-size="10"
                text-anchor="middle"
                fill="black"
                font-family="Arial, sans-serif"
                letter-spacing="7"
            >
                HOUSE
            </text>
        </svg>

        <p>Style zonder regels.</p>
    </header>

    <nav class="navigation" aria-label="Hoofdnavigatie">
        <a href="#home">Home</a>
        <a href="#nieuw">Nieuw</a>
        <a href="#hoodies">Kids</a>
        <a href="#sport">Sport</a>
        <a href="#sale">Sale</a>
       
    </nav>

    <h2 class="new-title" id="nieuw">NIEUW!</h2>

    <main>

        <section class="products" id="home">

            <article class="product-card" id="hoodies">
                <img src="hoodie.jpg" alt="Witte kinderhoodie">
                <p>Witte Hoodie Kids - €29,95</p>
            </article>

            <article class="product-card">
                <img src="product2.jpg" alt="Product 2">
                <p>Product 2</p>
            </article>

            <article class="product-card">
                <img src="product3.jpg" alt="Product 3">
                <p>Product 3</p>
            </article>

            <article class="product-card">
                <img src="product4.jpg" alt="Product 4">
                <p>Product 4</p>
            </article>

        </section>

        <div class="divider"></div>

        <h2 class="section-title" id="sale">BLACK FRIDAY!</h2>

        <section class="products" id="sport">

            <article class="product-card">
                <img src="product5.jpg" alt="Product 5">
                <p>Product 5</p>
            </article>

            <article class="product-card">
                <img src="product6.jpg" alt="Product 6">
                <p>Product 6</p>
            </article>

            <article class="product-card">
                <img src="product7.jpg" alt="Product 7">
                <p>Product 7</p>
            </article>

            <article class="product-card">
                <img src="product8.jpg" alt="Product 8">
                <p>Product 8</p>
            </article>

        </section>

        <section id="contact" style="text-align: center; padding: 40px 20px;">
            <h2 class="section-title">CONTACT</h2>
            <p>Neem contact met ons op voor vragen over je bestelling.</p>
        </section>

    </main>

</body>
</html>
